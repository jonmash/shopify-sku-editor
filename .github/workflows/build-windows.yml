name: Build Windows EXE

on:
  workflow_dispatch:      # lets you click "Run workflow" on GitHub whenever you want a build
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]    # pushing a tag like v1.1.0 also publishes a GitHub Release

permissions:
  contents: write          # needed to publish a Release when a tag is pushed

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Set version for this build
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "${GITHUB_REF_NAME#v}" > VERSION
          fi
          echo "Building version: $(cat VERSION)"

      - name: Build LindaSKUEditor.exe
        run: >
          pyinstaller --onefile --name LindaSKUEditor
          --icon "icon.ico"
          --add-data "static;static"
          --add-data "VERSION;."
          --collect-all uvicorn
          --collect-all fastapi
          --collect-all starlette
          --collect-all reportlab
          --collect-all pystrich
          --collect-all PIL
          app.py

      - uses: actions/upload-artifact@v7
        with:
          name: LindaSKUEditor-windows
          path: dist/LindaSKUEditor.exe

      # Only runs when the trigger was a version tag (e.g. git tag v1.1.0 && git push --tags).
      # This is what the app's "check for updates" banner actually looks at.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LindaSKUEditor.exe
          generate_release_notes: true
